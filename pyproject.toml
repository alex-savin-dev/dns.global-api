[project]
name = "dns-global"
version = "0.1.0"
description = "DNS.GLOBAL — API-first DNS automation service"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.0,<1.0",
    "uvicorn[standard]>=0.44.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "alembic>=1.18.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "dnspython>=2.8.0",
    "redis>=7.1.0",
    "cryptography>=46.0.0",
    "httpx>=0.28.0",
    "python-json-logger>=3.3.0",
    "bcrypt>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.28.0",
    "ruff>=0.15.0",
    "mypy>=1.20.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
